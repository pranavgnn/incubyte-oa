# Lint, format and typecheck only. Tests are deliberately not run here
# so failing-test (red) commits stay possible in the TDD cycle.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,tsx,json,jsonc,css,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    - name: typecheck
      run: pnpm typecheck
