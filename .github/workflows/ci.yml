name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dealership
          POSTGRES_PASSWORD: dealership
          POSTGRES_DB: dealership_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealership"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Every key in apps/api/src/config/env-schema.ts, so the env parser
    # never fails in CI. These are CI-only dummies, not real secrets.
    env:
      LEFTHOOK: 0
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://dealership:dealership@localhost:5432/dealership
      TEST_DATABASE_URL: postgres://dealership:dealership@localhost:5432/dealership_test
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-real
      JWT_EXPIRES_IN: 15m
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # The service starts with only the test database; create the dev
      # one so DATABASE_URL and TEST_DATABASE_URL stay distinct.
      - name: Create dev database
        run: psql "postgres://dealership:dealership@localhost:5432/postgres" -c "CREATE DATABASE dealership"

      - run: pnpm --filter @dealership/api db:migrate

      - run: pnpm test:coverage
